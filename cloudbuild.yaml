options:
  logging: CLOUD_LOGGING_ONLY  # Use Cloud Logging for logs
  machineType: E2_HIGHCPU_8    # The image is large (~3 GB) so use a beefier builder

steps:
# Pull the cached image from Artifact Registry (with fallback for first build)
- name: 'gcr.io/cloud-builders/docker'
  entrypoint: 'bash'
  args: ['-c', 'docker pull us-central1-docker.pkg.dev/$PROJECT_ID/propvrtwt/hat-service/$BRANCH_NAME/app:latest || exit 0']
  id: Pulling cached image

# Build the container image
- name: gcr.io/cloud-builders/docker
  args: [
    'build',
    '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/propvrtwt/hat-service/$BRANCH_NAME/app:${COMMIT_SHA}',
    '--cache-from', 'us-central1-docker.pkg.dev/$PROJECT_ID/propvrtwt/hat-service/$BRANCH_NAME/app:latest',
    '-f', 'Dockerfile',
    '.'
  ]
  id: Building the container image

# Push the container image to Artifact Registry
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/propvrtwt/hat-service/$BRANCH_NAME/app:${COMMIT_SHA}']
  id: Pushing the image to registry

# Tag the image as latest
- name: 'gcr.io/cloud-builders/docker'
  args: ['tag', 'us-central1-docker.pkg.dev/$PROJECT_ID/propvrtwt/hat-service/$BRANCH_NAME/app:${COMMIT_SHA}', 'us-central1-docker.pkg.dev/$PROJECT_ID/propvrtwt/hat-service/$BRANCH_NAME/app:latest']
  id: Tagging image as latest

# Push the latest tag
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/propvrtwt/hat-service/$BRANCH_NAME/app:latest']
  id: Pushing latest tag

# Create or update Cloud Run Service
- name: 'gcr.io/cloud-builders/gcloud'
  args:
    - 'run'
    - 'deploy'
    - '${_SERVICE_NAME}'
    - '--image'
    - 'us-central1-docker.pkg.dev/$PROJECT_ID/propvrtwt/hat-service/$BRANCH_NAME/app:${COMMIT_SHA}'
    - '--region'
    - '${_REGION_NAME}'
  id: Deploying to Cloud Run

timeout: '3600s'
